[project]
name = "bgis"
version = "0.1.0"
description = "Belief Graph Intelligence System"
requires-python = ">=3.12"

[project.scripts]
bgis = "bgis.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
